name: Release do dashboard

# Ao criar uma tag v* (ex.: v1.0.0), compila o dashboard e anexa o web_dist.zip à Release.
# Quem não tem Node.js baixa esse zip pelo iniciar.bat / iniciar.sh.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A tag precisa bater com version.py
        run: |
          V=$(python3 -c "from version import VERSION; print(VERSION)")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} não bate com version.py (v$V). Atualize version.py e crie a tag de novo."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compilar o dashboard
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Empacotar
        run: cd web/dist && zip -r ../../web_dist.zip .
      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          files: web_dist.zip
          # Texto das novidades vem de RELEASE_NOTES.md; o link "Full Changelog" é anexado automaticamente.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true

  # App do Windows: empacota o bot + dashboard num executável, gera o instalador (Inno Setup) e anexa à Release.
  # O painel do app baixa esse instalador sozinho quando sai versão nova.
  windows:
    needs: dashboard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compilar o dashboard
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Empacotar o app (PyInstaller)
        run: |
          pip install -r requirements.txt pyinstaller pystray pillow
          python scripts/build_windows.py
      - name: Gerar o instalador
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          V=$(python -c "from version import VERSION; print(VERSION)")
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$V" deploy/windows/installer.iss
      - name: Versão portátil (zip, sem instalar)
        shell: pwsh
        run: Compress-Archive -Path dist/PokeIdleManager -DestinationPath dist/PokeIdleManager-portatil.zip
      - name: Anexar o instalador e a versão portátil à Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PokeIdleManager-Setup.exe
            dist/PokeIdleManager-portatil.zip

  # Depois de publicar a Release, avisa no canal de changelog do Discord (texto das notas + imagens de
  # changelog/<tag>/). Sem o segredo DISCORD_CHANGELOG_WEBHOOK, não envia nada; uma falha aqui não derruba a Release.
  changelog:
    needs: dashboard
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Postar o changelog no Discord
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: python3 scripts/post_changelog.py --tag "${GITHUB_REF_NAME}"
