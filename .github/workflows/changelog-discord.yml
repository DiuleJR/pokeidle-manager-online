name: Changelog no Discord

# Posta (ou reposta) no canal do Discord o changelog de uma versão que já existe.
# Actions > "Changelog no Discord" > Run workflow > informe a tag (ex.: v1.5.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão (ex.: v1.5.0)"
        required: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Postar o changelog no Discord
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Tag inválida: $TAG"; exit 1;; esac
          python3 scripts/post_changelog.py --tag "$TAG"
