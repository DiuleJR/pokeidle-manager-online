# Opcional. Uso: docker compose up -d --build
# Abra http://localhost:8080 e crie a senha. Se for criar de fora, o código de configuração
# aparece em: docker compose logs
services:
  pokeidle:
    build: .
    restart: unless-stopped
    ports:
      # Só local. Para acessar de fora, prefira túnel SSH ou HTTPS (veja o README).
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    environment:
      # TELEMETRY_TOKEN: opcional; chave de acesso para scripts (também vale como senha)
      TELEMETRY_TOKEN: ${TELEMETRY_TOKEN:-}
